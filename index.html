<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Avanzata</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.btn-add {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-add:hover {
      background: var(--primary-hover);
    }

    /* Controls Bar (Filtri e Azioni) */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      background: transparent;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
    }

    .filter-btn.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
    }

    .btn-clear {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-clear:hover {
      color: var(--danger);
      text-decoration: underline;
    }

    /* Lista e Drag & Drop */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      user-select: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .task-item.dragging {
      opacity: 0.4;
      background: #e2e8f0;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      margin-right: 10px;
      font-size: 1.1rem;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .task-item.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .task-content input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 1.1rem;
    }

    .btn-delete:hover {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lista Attività</h1>
    
    <form class="input-group" id="todo-form">
      <input type="text" id="todo-input" placeholder="Aggiungi una nuova attività..." required autocomplete="off">
      <button type="submit" class="btn-add">Aggiungi</button>
    </form>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Tutti</button>
        <button class="filter-btn" onclick="setFilter('active', this)">Attivi</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">Completati</button>
      </div>
      <button class="btn-clear" onclick="clearCompleted()">Elimina completati</button>
    </div>

    <ul class="task-list" id="todo-list"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">Nessuna attività presente.</div>
  </div>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');

    let tasks = JSON.parse(localStorage.getItem('my_todos_v2')) || [];
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('my_todos_v2', JSON.stringify(tasks));
    }

    function renderTasks() {
      list.innerHTML = '';

      const filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filteredTasks.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      filteredTasks.forEach((task) => {
        const realIndex = tasks.indexOf(task);
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.draggable = true;
        li.dataset.index = realIndex;

        li.innerHTML = `
          <div style="display: flex; align-items: center; flex: 1;">
            <span class="drag-handle" title="Trascina per riordinare">&#x2630;</span>
            <div class="task-content" onclick="toggleTask(${realIndex})">
              <input type="checkbox" ${task.completed ? 'checked' : ''}>
              <span>${escapeHtml(task.text)}</span>
            </div>
          </div>
          <button class="btn-delete" onclick="deleteTask(event, ${realIndex})" title="Elimina">&times;</button>
        `;

        addDragListeners(li);
        list.appendChild(li);
      });
    }

    function addTask(text) {
      tasks.push({ text: text, completed: false });
      saveTasks();
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(event, index) {
      event.stopPropagation();
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // --- Drag and Drop Logic ---
    let dragSrcIndex = null;

    function addDragListeners(item) {
      item.addEventListener('dragstart', (e) => {
        dragSrcIndex = Number(item.dataset.index);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetIndex = Number(item.dataset.index);
        if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
          const [movedItem] = tasks.splice(dragSrcIndex, 1);
          tasks.splice(targetIndex, 0, movedItem);
          saveTasks();
          renderTasks();
        }
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text) {
        addTask(text);
        input.value = '';
      }
    });

    renderTasks();
  </script>
</body>
</html>
